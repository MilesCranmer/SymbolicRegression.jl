name: CI Extended

on:
  push:
    branches:
      - master
      - release-*
    paths:
      - "src/**"
      - "ext/**"
      - "test/**"
      - "Project.toml"
      - "coverage.jl"
      - ".github/workflows/CI*.yml"
  pull_request:
    branches:
      - master
      - release-*
    paths:
      - "src/**"
      - "ext/**"
      - "test/**"
      - "Project.toml"
      - "coverage.jl"
      - ".github/workflows/CI*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: u/${{ matrix.group }}-${{ matrix.julia-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        julia-version: ["1.10", "1"]
        group:
          - basic
          - expressions
          - templates
          - operators-core
          - constraints
          - evolution-core
          - evaluation
          - dataset
          - parallel
          - precompile
          - backsolve
          - misc
          - plugins
        exclude:
          # Only run Julia 1.10 on ubuntu
          - os: macOS-latest
            julia-version: "1.10"
          - os: windows-latest
            julia-version: "1.10"
          # Already covered by the required CI workflow
          - os: ubuntu-latest
            julia-version: "1"
            group: basic
          - os: macOS-latest
            julia-version: "1"
            group: basic
          - os: windows-latest
            julia-version: "1"
            group: basic

    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: "Cache dependencies"
        uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};os=${{ matrix.os }};julia=${{ matrix.julia-version }};group=unit-${{ matrix.group }};project=${{ hashFiles('test/Project.toml') }}
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Run unit tests (${{ matrix.group }})"
        env:
          TEST_GROUP: unit/${{ matrix.group }}
        run: |
          julia --color=yes -e 'import Pkg; Pkg.add("Coverage")'
          julia --color=yes --project=. --threads=auto --check-bounds=yes --depwarn=yes --code-coverage=user -e 'import Coverage; import Pkg; Pkg.test(coverage=true)'
          julia --color=yes coverage.jl
        shell: bash
      - name: "Sanitize artifact group"
        id: sanitize_unit_group
        shell: bash
        run: |
          group='${{ matrix.group }}'
          safe_group="${group//\//-}"
          echo "group=$safe_group" >> "$GITHUB_OUTPUT"
      - name: "Upload coverage artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ steps.sanitize_unit_group.outputs.group }}-${{ matrix.julia-version }}-${{ matrix.os }}
          path: lcov.info
          retention-days: 1

  integration:
    name: i/${{ matrix.group }}-${{ matrix.julia-version }}-ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
        group:
          - ad/forwarddiff
          - ad/zygote
          - ad/enzyme
          - ad/mooncake
          - ad/mooncakev1
          - aqua
          - jet
          - ext/mlj/core
          - ext/mlj/mti
          - ext/mlj/templates
          - ext/mlj/parametric_search
          - ext/symbolicutils
          - ext/json_tracing
          - ext/dynamicquantities_units
          - ext/loopvectorization
          - ext/pythoncall
          - examples/readme
          - examples/parameterized_function
          - examples/custom_types
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: "Sanitize group"
        id: sanitize_integration_group
        shell: bash
        run: |
          group='${{ matrix.group }}'
          safe_group="${group//\//-}"
          echo "group=$safe_group" >> "$GITHUB_OUTPUT"
      - name: "Cache dependencies"
        uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};group=integration-${{ steps.sanitize_integration_group.outputs.group }};julia=${{ matrix.julia-version }};project=${{ hashFiles(format('test/integration/{0}/Project.toml', matrix.group)) }}
          # LoopVectorization codegen is CPU-sensitive; cached compiled code
          # from a different runner CPU can be invalid.
          cache-compiled: ${{ matrix.group != 'ext/loopvectorization' }}
      - name: "Run integration test"
        env:
          TEST_GROUP: integration/${{ matrix.group }}
        run: |
          julia --color=yes -e 'import Pkg; Pkg.add("Coverage")'
          julia --color=yes --project=. --threads=auto --check-bounds=yes --code-coverage=user -e 'import Coverage; import Pkg; Pkg.test(coverage=true)'
          julia --color=yes coverage.jl
        shell: bash
      - name: "Upload coverage artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-${{ steps.sanitize_integration_group.outputs.group }}-${{ matrix.julia-version }}
          path: lcov.info
          retention-days: 1

  repl-stdin-monitoring:
    name: u/repl-stdin-monitoring-1.10-ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"
      - name: "Cache dependencies"
        uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};group=repl-stdin-monitoring;project=${{ hashFiles('Project.toml') }}
      - name: "Build package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Install expect"
        run: sudo apt-get update && sudo apt-get install -y expect
        shell: bash
      - name: "Run REPL stdin monitoring test"
        run: |
          julia --project=. --startup-file=no --history-file=no --color=no -q -e 'using SymbolicRegression'
          expect test/repl/test_repl_stdin_nonblocking.exp
        shell: bash

  upload-coverage:
    name: Upload Coverage to Codecov
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true
